name: unflake
description: "Green CI without the rerun ritual — scan for flake anti-patterns, upload SARIF, gate on flakes."
branding:
  icon: check-circle
  color: green

inputs:
  target:
    description: "File or directory to static-scan."
    default: "."
  fail-on:
    description: "scan gate: error, warning, or info."
    default: "warning"
  upload-sarif:
    description: "Upload findings to GitHub code scanning."
    default: "true"

runs:
  using: composite
  steps:
    - name: Install unflake
      shell: bash
      run: pip install "${GITHUB_ACTION_PATH}"
    - name: Scan
      shell: bash
      env:
        # Inputs pass through env, never shell interpolation (injection-safe).
        UNFLAKE_TARGET: ${{ inputs.target }}
        UNFLAKE_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        unflake scan "$UNFLAKE_TARGET" --format sarif > "${RUNNER_TEMP}/unflake.sarif"
        echo "UNFLAKE_SCAN_EXIT=$?" >> "${GITHUB_ENV}"
        unflake scan "$UNFLAKE_TARGET" --fail-on "$UNFLAKE_FAIL_ON"
        echo "UNFLAKE_GATE_EXIT=$?" >> "${GITHUB_ENV}"
        cp "${RUNNER_TEMP}/unflake.sarif" ./unflake.sarif
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
      with:
        sarif_file: unflake.sarif
        category: unflake
    - name: Gate
      shell: bash
      run: exit "${UNFLAKE_GATE_EXIT}"
