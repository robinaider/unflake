name: study

# Wild-flake recall study: free for public repos (unlimited Actions minutes).
# ~10 min/night. Results upload as artifacts; a reproduced flake is a
# launch-content event, not a failure — this job never blocks merges.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Minimal token: read the repo, upload study artifacts.
permissions:
  contents: read
  actions: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unflake + pytest
        run: |
          pip install -e . pytest==8.3.5
      - name: Run wild-flake study
        run: |
          python3 benchmarks/study_v2/run_study.py --runs 10
      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-${{ matrix.python-version }}-${{ github.run_id }}
          path: benchmarks/study_v2/results/
