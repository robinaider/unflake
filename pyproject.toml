[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unflake"
version = "0.6.1"
description = "Green CI without the rerun ritual — detect, score, and quarantine flaky tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["testing", "flaky-tests", "ci", "qa", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
unflake = "unflake.cli:main"

[project.urls]
Homepage = "https://github.com/robinaider/unflake"
Issues = "https://github.com/robinaider/unflake/issues"

[tool.setuptools.packages.find]
where = ["src"]
